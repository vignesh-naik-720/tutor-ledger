name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit frontend
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: Audit backend
        working-directory: backend
        run: npm ci && npm audit --audit-level=high
      - name: Audit forecast
        working-directory: shared/forecast
        run: npm ci && npm audit --audit-level=high
      - name: Audit e2e
        working-directory: e2e
        run: npm ci && npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
      - name: Forecast tests
        working-directory: shared/forecast
        run: npm ci && npm test
